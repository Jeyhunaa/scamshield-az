# Demo scenarios for the dashboard and API examples.
# Only INPUTS are defined here. Risk scores and actions are always computed live by the
# trained models and the decision engine — nothing about the outcome is hard-coded.
#
# intended_action: the outcome the scenario is DESIGNED to illustrate. It is never used to
#   make a decision; tests/test_models.py checks that the live models actually produce it.
# customer_view: cosmetic details for the simulated mobile-banking screen (fictional people,
#   fictional bank codes). They do not affect the models.
# Journey events: [event_type, seconds since session start]

