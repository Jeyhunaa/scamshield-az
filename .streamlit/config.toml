# Dashboard design system (shared palette with the customer app in web/).

[server]
enableStaticServing = true   # serves app/static (bundled Inter font)

[browser]
gatherUsageStats = false

[theme]
base = "light"
font = "Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
headingFont = "Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
baseFontSize = 14
headingFontWeights = [650, 650, 600, 600, 600, 600]
primaryColor = "#14365d"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#101828"
linkColor = "#1f5aa6"
borderColor = "#e4e7ec"
dataframeBorderColor = "#eef0f3"
dataframeHeaderBackgroundColor = "#f8f9fb"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
metricValueFontWeight = 650
chartCategoricalColors = ["#1f5aa6", "#a3abb8", "#b54708", "#067647"]

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"

[theme.sidebar]
backgroundColor = "#f8f9fb"
secondaryBackgroundColor = "#ffffff"
